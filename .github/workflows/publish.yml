name: Publish

# Publishes @draggable/storeshot-sdk to npm with provenance (npm only accepts provenance from a
# public repository built on a GitHub-hosted runner). OFF until the repository variable
# SDK_PUBLISH_ENABLED is 'true'; it authenticates with NPM_TOKEN, the Draggable organisation-level
# Actions secret. Runs on a manual dispatch (dry run by default) or a pushed v* tag,
# whose name must equal the package version. The prepublishOnly guard refuses any other context.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'npm publish --dry-run (uploads nothing)'
        type: boolean
        default: true
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @draggable/storeshot-sdk
    if: vars.SDK_PUBLISH_ENABLED == 'true' && github.repository == 'Draggable/storeshot-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Package version matches the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::package.json is $version, the tag is $TAG"
            exit 1
          fi

      - name: Generated types match contract/openapi.json
        run: npm run generate -- --check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package check (file list, require/import, consumer types, bundles)
        run: npm run check:package

      # A re-run (or a dispatch) of a version that is already on npm publishes nothing.
      - name: Skip a version that is already published
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ -n "$(npm view "@draggable/storeshot-sdk@$version" version 2>/dev/null || true)" ]]; then
            echo "::notice::@draggable/storeshot-sdk@$version is already on npm."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: steps.published.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          STORESHOT_SDK_PUBLISH: '1'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
